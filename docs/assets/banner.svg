<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="DN Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- scripts/store-assets.ts renders this file with the bundled fonts. Without them, the text uses a system font. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232424"/>
      <stop offset="0.6" stop-color="#171717"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#97c47d" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#97c47d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2c2c"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
    <clipPath id="win"><rect x="600" y="96" width="600" height="448" rx="14"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="900" cy="320" r="440" fill="url(#halo)"/>

  <!-- Text column. -->
  <g transform="translate(80 112) scale(0.6875)">
    <rect width="128" height="128" rx="28" fill="url(#iconbg)"/>
    <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#97c47d" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M40 36 L64 70 L88 36 M64 70 V96" fill="none" stroke="#97c47d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ededed" font-size="58" font-weight="800" letter-spacing="-1.5">
    <text x="80" y="282">Dark theme</text>
    <text x="80" y="346">for Hacker<tspan fill="#97c47d">news</tspan></text>
  </g>
  <text x="80" y="402" fill="#aaacac" font-size="24">Hacker News in dark colors,</text>
  <text x="80" y="436" fill="#aaacac" font-size="24">with better fonts and bigger text.</text>
  <text x="80" y="492" fill="#828484" font-size="17">CSS only  ·  No scripts  ·  No permissions</text>
  <g transform="translate(80 518)">
    <rect width="190" height="38" rx="19" fill="#97c47d" fill-opacity="0.12" stroke="#97c47d" stroke-opacity="0.45"/>
    <text x="95" y="25" text-anchor="middle" fill="#97c47d" font-size="15" font-weight="600">Chrome extension</text>
  </g>

  <!-- Browser window. -->
  <g filter="url(#shadow)">
    <rect x="600" y="96" width="600" height="448" rx="14" fill="#171717"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="600" y="96" width="600" height="36" fill="#2b2c2c"/>
    <circle cx="622" cy="114" r="6" fill="#ff5f57"/>
    <circle cx="642" cy="114" r="6" fill="#febc2e"/>
    <circle cx="662" cy="114" r="6" fill="#28c840"/>
    <rect x="720" y="104" width="360" height="20" rx="10" fill="#171717"/>
    <text x="900" y="118.500" text-anchor="middle" fill="#828484" font-size="12">news.ycombinator.com</text>

    <!-- The HN header. -->
    <rect x="630" y="150" width="540" height="42" rx="10" fill="#1e1f1f"/>
    <rect x="643" y="162" width="18" height="18" rx="4" fill="#171717" stroke="#97c47d"/>
    <path d="M648 167 L652 172.500 L656 167 M652 172.500 V176" fill="none" stroke="#97c47d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="672" y="176" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ededed" font-size="15" font-weight="700">Hacker News</text>
    <text x="776" y="176" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#aaacac" font-size="13"><tspan fill="#97c47d">new</tspan><tspan fill="#828484">  |  </tspan>past<tspan fill="#828484">  |  </tspan>comments<tspan fill="#828484">  |  </tspan>ask<tspan fill="#828484">  |  </tspan>show</text>
    <text x="1156" y="176" text-anchor="end" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#aaacac" font-size="13">login</text>

    <!-- The story list. -->
    <text x="656" y="226" text-anchor="end" fill="#828484" font-size="13">1.</text>
    <path d="M664 224 l5 -8 l5 8 z" fill="#aaacac"/>
    <text x="684" y="226" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed">Show HN: A dark theme for this page<tspan dx="7" font-family="DN Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#828484">(github.com)</tspan></text>
    <text x="684" y="246" fill="#aaacac" font-size="11.5">128 points by ada 3 hours ago | 42 comments</text>
    <text x="656" y="284" text-anchor="end" fill="#828484" font-size="13">2.</text>
    <path d="M664 282 l5 -8 l5 8 z" fill="#aaacac"/>
    <text x="684" y="284" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed">Why small tools last longer<tspan dx="7" font-family="DN Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#828484">(example.com)</tspan></text>
    <text x="684" y="304" fill="#aaacac" font-size="11.5">96 points by grace 5 hours ago | 31 comments</text>
    <text x="656" y="342" text-anchor="end" fill="#828484" font-size="13">3.</text>
    <path d="M664 340 l5 -8 l5 8 z" fill="#aaacac"/>
    <text x="684" y="342" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed">The history of the status line<tspan dx="7" font-family="DN Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#828484">(example.org)</tspan></text>
    <text x="684" y="362" fill="#aaacac" font-size="11.5">211 points by linus 7 hours ago | 88 comments</text>
    <text x="656" y="400" text-anchor="end" fill="#828484" font-size="13">4.</text>
    <path d="M664 398 l5 -8 l5 8 z" fill="#aaacac"/>
    <text x="684" y="400" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed">Ask HN: What do you read at night?</text>
    <text x="684" y="420" fill="#aaacac" font-size="11.5">64 points by margaret 2 hours ago | 57 comments</text>
    <text x="656" y="458" text-anchor="end" fill="#828484" font-size="13">5.</text>
    <path d="M664 456 l5 -8 l5 8 z" fill="#aaacac"/>
    <text x="684" y="458" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed">A field guide to variable fonts<tspan dx="7" font-family="DN Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#828484">(example.net)</tspan></text>
    <text x="684" y="478" fill="#aaacac" font-size="11.5">173 points by dennis 9 hours ago | 23 comments</text>
    <text x="684" y="522" fill="#97c47d" font-size="13" font-weight="600">More</text>
  </g>
</svg>
