<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" font-family="DN Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- scripts/store-assets.ts renders this file with the bundled fonts. Without them, the text uses a system font. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232424"/>
      <stop offset="0.6" stop-color="#171717"/>
      <stop offset="1" stop-color="#0e0e0e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#97c47d" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#97c47d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2c2c"/>
      <stop offset="1" stop-color="#131313"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <circle cx="220" cy="96" r="180" fill="url(#halo)"/>
  <g transform="translate(176 40) scale(0.6875)">
    <rect width="128" height="128" rx="28" fill="url(#iconbg)"/>
    <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#97c47d" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M40 36 L64 70 L88 36 M64 70 V96" fill="none" stroke="#97c47d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="220" y="184" text-anchor="middle" font-family="DN Figtree, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ededed" font-size="30" font-weight="800" letter-spacing="-0.6">Dark theme for Hacker<tspan fill="#97c47d">news</tspan></text>
  <text x="220" y="220" text-anchor="middle" fill="#aaacac" font-size="16">Better fonts. Bigger text. No scripts.</text>
</svg>
